{% extends "base_auth.html" %}
{% block title %}Payment Successful — Circle Core{% endblock %}

{% block content %}
<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--color-bg-base);">
  <div style="width:100%;max-width:400px;text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1 style="font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--color-text-primary);margin-bottom:10px;">Payment Successful</h1>
    <p style="font-size:14px;color:var(--color-text-secondary);margin-bottom:32px;line-height:1.6;">
      Your subscription is now active. Thank you for choosing Circle Core Guest House.
    </p>
    <a href="/" class="btn btn-primary" style="display:inline-block;padding:13px 32px;font-size:14px;font-weight:600;">
      Go to Dashboard
    </a>
  </div>
</main>
{% endblock %}
