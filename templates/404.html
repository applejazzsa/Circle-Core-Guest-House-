<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Circle Core Guest House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--color-bg-base);">
  <div style="width:100%; max-width:440px; text-align:center;">
    <div style="font-family:var(--font-display); font-size:80px; font-weight:800; color:var(--color-border-bright); line-height:1; margin-bottom:20px;">404</div>
    <div style="font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--color-text-primary); margin-bottom:10px;">Page not found</div>
    <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:28px;">The page you're looking for may have moved, or the address may be incorrect.</p>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <a href="{% url 'core:home' %}" style="display:inline-flex; align-items:center; gap:6px; background:var(--color-green-500); color:#0d0f12; font-weight:600; font-size:13.5px; padding:10px 20px; border-radius:var(--radius-md); text-decoration:none; transition:opacity 0.15s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">← Back to Dashboard</a>
    </div>
    <div style="margin-top:40px; font-size:13px; color:var(--color-text-tertiary);">
      <span style="font-family:var(--font-display); font-weight:700; color:var(--color-green-400);">Circle Core</span> · Guest House
    </div>
  </div>
</body>
</html>
