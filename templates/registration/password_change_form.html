{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto py-12 px-4">
  <h1 class="text-2xl font-semibold mb-3">Choose a new password</h1>
  <p class="mb-6">Your account requires a password change before you can continue.</p>
  <form method="post" class="space-y-4">{% csrf_token %}{{ form.as_p }}<button type="submit">Update password</button></form>
</div>
{% endblock %}
