{% extends "base_auth.html" %}
{% block title %}Password Updated - Circle Core Guest House{% endblock %}

{% block content %}
<main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--color-bg-base);">
  <div class="card" style="width:100%; max-width:420px; padding:28px; text-align:center;">
    <div class="section-label">Account Recovery</div>
    <h1 style="font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--color-text-primary); margin:6px 0 10px;">Password updated</h1>
    <p style="font-size:13.5px; color:var(--color-text-secondary); line-height:1.5; margin-bottom:20px;">You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="justify-content:center;">Sign in</a>
  </div>
</main>
{% endblock %}
