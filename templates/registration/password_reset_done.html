{% extends "base_auth.html" %}
{% block title %}Reset Email Sent - Circle Core Guest House{% endblock %}

{% block content %}
<main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--color-bg-base);">
  <div class="card" style="width:100%; max-width:420px; padding:28px; text-align:center;">
    <div class="section-label">Check Your Inbox</div>
    <h1 style="font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--color-text-primary); margin:6px 0 10px;">Reset link sent</h1>
    <p style="font-size:13.5px; color:var(--color-text-secondary); line-height:1.5; margin-bottom:20px;">If that email exists for this guest house, a password reset link has been sent.</p>
    <a href="{% url 'login' %}" class="btn btn-secondary" style="justify-content:center;">Back to sign in</a>
  </div>
</main>
{% endblock %}
