<!-- ═══════════════════════════════════════════════════════════
     Circle Core Guest House — Shared Email Header
     Include this at the top of every email template body.
     Uses table-based layout for maximum email client compatibility
     (works in Outlook, Gmail, Apple Mail, Yahoo).
     ═══════════════════════════════════════════════════════════ -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding-bottom:28px;">
  <tr>
    <td align="center">

      <!-- Logo mark (real brand icon — <img> renders reliably across Outlook, Gmail, Apple Mail, Yahoo) -->
      <img src="https://circlecore.co.za/static/branding/circle-core-icon-master.png" width="52" height="52" alt="Circle Core Guest House" style="width:52px;height:52px;border-radius:12px;display:block;margin:0 auto 14px;">

      <!-- Wordmark -->
      <div style="font-size:20px;font-weight:800;color:#f1f5f9;letter-spacing:-0.5px;font-family:Arial,Helvetica,sans-serif;line-height:1.2;">Circle Core</div>
      <div style="font-size:10px;color:#64748b;letter-spacing:3px;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif;margin-top:3px;">Guest House</div>

    </td>
  </tr>
</table>
