<!-- ═══════════════════════════════════════════════════════════
     Circle Core Guest House — Shared Email Header
     Include this at the top of every email template body.
     Uses table-based layout for maximum email client compatibility
     (works in Outlook, Gmail, Apple Mail, Yahoo).
     ═══════════════════════════════════════════════════════════ -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding-bottom:28px;">
  <tr>
    <td align="center">

      <!-- Logo mark (2×2 grid icon, table-based — no SVG for Outlook compat) -->
      <table cellpadding="0" cellspacing="0" border="0" style="display:inline-table;margin-bottom:14px;">
        <tr>
          <td style="background:#22c55e;border-radius:12px;width:52px;height:52px;text-align:center;vertical-align:middle;">
            <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
              <tr>
                <td style="width:11px;height:11px;background:rgba(0,0,0,0.85);border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
                <td style="width:4px;font-size:0;">&nbsp;</td>
                <td style="width:11px;height:11px;background:rgba(0,0,0,0.45);border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
              <tr><td colspan="3" style="height:4px;font-size:0;line-height:0;">&nbsp;</td></tr>
              <tr>
                <td style="width:11px;height:11px;background:rgba(0,0,0,0.45);border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
                <td style="width:4px;font-size:0;">&nbsp;</td>
                <td style="width:11px;height:11px;background:rgba(0,0,0,0.85);border-radius:2px;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

      <!-- Wordmark -->
      <div style="font-size:20px;font-weight:800;color:#f1f5f9;letter-spacing:-0.5px;font-family:Arial,Helvetica,sans-serif;line-height:1.2;">Circle Core</div>
      <div style="font-size:10px;color:#64748b;letter-spacing:3px;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif;margin-top:3px;">Guest House</div>

    </td>
  </tr>
</table>
