{% extends "base_public.html" %}
{% block title %}Verification Failed — Circle Core{% endblock %}

{% block content %}
<div style="max-width:480px;margin:80px auto;padding:0 24px;text-align:center;">
  <div class="card" style="padding:40px;">
    <div style="width:52px;height:52px;border-radius:50%;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </div>
    <h1 style="font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--color-text-primary);margin-bottom:10px;">Link Expired</h1>
    <p style="font-size:14px;color:var(--color-text-secondary);margin-bottom:24px;line-height:1.6;">
      This verification link is invalid or has expired. Please contact support if you need help verifying your account.
    </p>
    <a href="mailto:support@circlecore.co.za" class="btn btn-primary" style="display:inline-block;">Contact Support</a>
  </div>
</div>
{% endblock %}
